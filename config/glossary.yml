# Glossary — seeded example. Fill in the TODO sections; everything here is editable.
#
# TWO TIERS, because Whisper's decode-time prompt is capped at ~224 tokens and a real
# glossary will not fit:
#
#   tier: prompt   Injected into `sona transcribe --prompt`. Biases decoding, so it can
#                  fix a word Whisper never had a chance to get right. Budget is tight
#                  (~30 terms). Reserve it for terms that are FREQUENT and that Whisper
#                  reliably mangles. Measured example: "Claude" -> "Clark".
#
#   tier: correct  Applied after transcription as a text-correction pass against the
#                  full list. Unbounded, so put everything else here. Cannot recover a
#                  word that was acoustically lost, but fixes near-misses cheaply.
#
# WARNING, measured and not theoretical: the prompt tier makes low-signal audio WORSE.
# On a segment below +1 dB speech-minus-rumble, priming Whisper with this vocabulary
# made it hallucinate these terms instead of random ones, and produced a repetition
# loop it did not produce unprompted. The prompt tier must only ever be applied to
# segments that clear the audio quality gate. The correct tier is safe anywhere.
#
# `variants` are the misrecognitions actually observed. Add to them as you review;
# that is the cheapest accuracy win available and it compounds.
#
# `about` is optional context for the summariser: when the conversation is about
# those topics, prefer this canonical name even if Whisper wrote a near-miss that
# is not yet in `variants`. Do not use it to invent a product that was not discussed.

terms:
