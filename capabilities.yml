# Capability manifest — consumed by ../gen_capabilities.py into CAPABILITIES.md
project: AutoWork
summary: >-
  Pocket voice recorder -> ingest by volume serial -> audio quality gate -> cloud
  transcription with diarization -> relevance gate -> daily summary email + grounded
  action items in a human review queue. Cloud stages run on a swappable LLM backend
  (OpenAI today, Anthropic one config value away); nothing is ever executed without
  human approval. Local inference was tried, measured, and removed: 358s to find 1 of 3
  real action items vs ~7s to find all 3 in the cloud.
status: working

provides:
  code:
    - AutoWork/autowork/gate.py (audio quality gate — two-condition, rejects audio Whisper would fabricate over)
    - AutoWork/autowork/transcribe_cloud.py (gate -> slice -> 32kbps mono compress -> OpenAI transcription with diarization)
    - AutoWork/autowork/relevance.py (is-this-a-work-conversation gate — drops podcasts and ambient noise, keeps on doubt)
    - AutoWork/autowork/summarize.py (daily summary with derived-not-generated metadata header)
    - AutoWork/autowork/day.py (per-recording sidecar so a day's summary is rebuilt, not overwritten)
    - AutoWork/autowork/calendar_lookup.py (Outlook invitees as derived metadata; omit when overlapping events are 0 or 2+)
    - AutoWork/autowork/mailer.py (Gmail SMTP; accepts GMAIL_*/SMTP_* names, strips pasted app-password spaces)
    - AutoWork/autowork/ingest.py (copy from recorder by volume serial; never deletes from device)
    - AutoWork/autowork/llm.py (swappable LLM backends — openai or anthropic, one config string)
    - AutoWork/tools/run_pipeline.py (end-to-end orchestrator; idempotent per recording)
    - AutoWork/scripts (setup.bat, run.bat, review.bat, review-ui.bat, USB watcher + scheduled-task installer)
    - AutoWork/autowork/transcribe.py (gate to slice to Whisper to glossary correction, plus repetition-loop detection)
    - AutoWork/autowork/glossary.py (two-tier glossary — budgeted decode prompt, single-pass correction, clarify-candidate list)
    - AutoWork/tools/transcribe_day.py (CLI to transcribe a day's recordings into auditable markdown)
    - AutoWork/tools/review.py (review CLI — see, approve, reject, retry queued actions; never executes)
    - AutoWork/tools/review_ui.py (localhost review page; mark done so items leave the morning digest; never executes)
    - AutoWork/scripts/review-ui.bat (opens the review page in a browser)
    - AutoWork/tools/extract_actions.py (CLI to extract grounded action items from transcripts into the queue)
    - AutoWork/autowork/extract.py (cloud extraction with quote grounding against the source transcript)
    - AutoWork/tools/eval_diarization.py (measures whether speaker diarization is viable on a recording; deliberately does not label)
    - AutoWork/tools/scan_audio.py (CLI to screen a day's recordings at ~3000x realtime before transcribing)
    - AutoWork/config/glossary.yml (two-tier domain glossary — decode-time prompt plus post-transcription correction)
    - AutoWork/autowork/action.py (ActionRecord — the vendor-neutral queue/executor contract)
    - AutoWork/autowork/queue.py (SQLite review queue, idempotent enqueue, enforced state machine)
    - AutoWork/autowork/executors/base.py (Executor ABC + Registry + dispatch; only APPROVED actions dispatch)
    - AutoWork/autowork/executors/dry_run.py (reference executor, warns below the fabrication threshold)
    - AutoWork/autowork/executors/file_handoff.py (writes an auditable markdown hand-off; survives loss of every target system)
    - AutoWork/SETTINGS.recommended.txt (recorder config with measured rationale)

uses:
  code:
    - OpenAI APIs (transcription with diarization, summary, extraction)
    - ffmpeg (audio gate and slice/compress; required)
    - Outlook desktop COM (optional; meeting title and invitees when a single event overlaps)

notes: >-
  Measured on a full workday of real audio (2026-08-24, 304 minutes): the discriminator
  for transcription success is speech-band energy minus sub-300Hz rumble, not loudness.
  >= +4 dB transcribes cleanly, +1 to +3 dB degrades proper nouns (recoverable with a
  glossary prompt), below +1 dB Whisper fabricates fluent text that reads exactly like
  real commitments. 64% of that day fell below +1 dB because the recorder was in a wallet
  inside a pocket. That failure mode — confident invention, never an error — is why the
  review queue is mandatory and why every ActionRecord carries the measured signal
  quality of its source window. Do not wire a live-write executor until capture clears
  the bar. Transcripts are TrueContext-confidential and are retained indefinitely by
  operator choice (all transcripts kept in one folder, deleted manually) — nothing in
  this pipeline expires them, so the retention decision is a standing manual one and
  should be revisited before any change of employer.
